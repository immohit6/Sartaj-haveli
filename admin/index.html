<style>
:root{
  --ink:#06120F; --deep:#0B2F27; --emerald:#124A3D; --jade:#1C6354;

  --line:rgba(247,242,231,.16); --paper:#F7F2E7; --paper-ink:#14201C; --paper-mute:#4A5550; --paper-line:#DDD3B8;
  --display:'Playfair Display','Noto Sans Gurmukhi','Noto Sans Devanagari',Georgia,serif;
  --body:'Manrope','Noto Sans Gurmukhi','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:#0A1512;color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--champ);outline-offset:3px}
[hidden]{display:none!important}
/* admin */
.admin{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.a-bar{position:sticky;bottom:0}
.a-top{position:sticky;top:0;background:#0A1512;z-index:5}
.admin[hidden]{display:none!important}
.a-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.a-top h2{font-size:24px}
.a-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);scrollbar-width:none}
.a-tabs button{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px}
.a-tabs button[aria-pressed="true"]{background:var(--champ);color:#14201C;border-color:var(--champ)}
.a-body{flex:1;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
.a-in{max-width:760px;margin:0 auto}
.a-in h3{font-size:26px;margin:6px 0 14px}
.a-in h4{font-family:var(--body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--champ);margin:26px 0 10px;font-weight:700}
.a-note{font-size:13px;color:var(--mute);margin:0 0 14px}
.af{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;color:var(--mute)}
.af input,.af textarea,.af select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(247,242,231,.06);color:var(--cream);padding:10px 12px;font:inherit;font-size:16px}
.af textarea{min-height:90px;resize:vertical}
.af.chk{flex-direction:row;align-items:center;gap:12px;font-size:15px;color:var(--cream)}
.af.chk input{min-height:0;width:22px;height:22px;accent-color:var(--champ)}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a-card{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.a-btn{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px}
.a-btn.pri{background:var(--champ);color:#14201C;border-color:var(--champ)}
.a-btn.dng{color:#F2A3A3;border-color:rgba(242,163,163,.4)}
.a-bar{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#0A1512}
#aStatus{font-size:13px;color:var(--mute)}
#aSave{min-height:48px;padding:0 22px}
@media(max-width:700px){.a-bar{padding-bottom:max(76px,env(safe-area-inset-bottom,0px))}}
.a-body{padding-bottom:90px}
.pf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pv{width:96px;height:72px;border-radius:12px;background:var(--emerald) center/cover;border:1px solid var(--line)}
.agal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:10px 0}
.agal div{position:relative;aspect-ratio:4/3;border-radius:12px;background:var(--emerald) center/cover}
.agal button{position:absolute;top:4px;right:4px;min-height:30px;width:30px;border-radius:50%;border:0;background:rgba(6,18,15,.8);color:var(--cream)}
.acal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0}
.acal .day{min-height:42px}
.acal .day.bk{background:#8C2F2F;border-color:#8C2F2F;color:#fff}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate>div{width:100%;max-width:440px;text-align:center;border:1px solid var(--line);border-radius:28px;padding:32px 22px}
.gate h1{font-size:34px;margin:0 0 10px}.gate p{color:var(--mute);margin:0 0 20px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{background:var(--champ);color:#14201C;border-color:var(--champ)}
.dow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center;padding:6px 0}
.day{aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:15px}

.slot{padding:14px}
.slot-w{margin:6px 0 12px;font-size:14px;color:var(--cream)}.slot-w span{color:var(--champ);font-weight:700}
.prev{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;justify-content:flex-end}
.prev[hidden]{display:none!important}
.prev-in{background:#0A1512;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.prev-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prev-top b{font-family:var(--display);font-size:20px}
.prev-frame{flex:1;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
.prev-frame iframe{width:100%;height:100%;border:0;display:block;background:#06120F}
.prev .pill{min-height:38px;padding:0 14px;font-size:14px}
</style></head><body>
<div class="gate" id="gate"><div>
  <h1>Admin sign-in</h1><p id="gateMsg">Sartaj Royal Group. Owner only.</p>
  <form id="loginForm" autocomplete="on" style="text-align:left">
    <label class="af">Email<input id="lgEmail" type="email" name="email" autocomplete="username" required></label>
    <label class="af">Password<input id="lgPass" type="password" name="password" autocomplete="current-password" required></label>
    <button class="a-btn pri" id="lgGo" type="submit" style="width:100%;min-height:48px">Sign in</button>
  </form>
  <p style="margin:18px 0 0"><a href="../" style="font-size:14px">Back to the site</a></p>
</div></div>
<div class="admin" id="admin" hidden>
  <div class="a-top"><h2>Admin</h2><span style="display:flex;gap:10px;align-items:center"><span id="aInboxFlag" class="note" style="font-size:13px;color:var(--champ)" hidden></span><a class="a-btn" href="../" style="display:inline-flex;align-items:center;text-decoration:none">View site</a><button class="a-btn" type="button" id="aOut">Sign out</button></span></div>
  <div class="a-tabs" id="aTabs"></div>
  <div class="a-body"><div class="a-in" id="aMain"></div></div>
  <div class="a-bar"><span style="display:flex;gap:10px"><button class="a-btn pri" type="button" id="aSave">Save changes</button></span><span id="aStatus" aria-live="polite"></span></div>
  <div class="prev" id="prev" hidden role="dialog" aria-modal="true" aria-label="Where this photo shows"><div class="prev-in">
    <div class="prev-top"><b id="prevTitle">Where it shows</b><button class="a-btn" type="button" data-act="pclose">Close</button></div>
    <p class="a-note" id="prevWhere" style="margin:0"></p><div class="pills" id="prevChips"></div><div class="pf" id="prevTools"></div>
    <div class="prev-frame"><iframe id="prevFrame" title="Preview of your website"></iframe></div>
    <p class="a-note" style="margin:0">This is your real site with your unsaved changes. The gold outline marks the spot. Press Save changes to make it live.</p>
  </div></div>
</div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function lc1(s){return /^[A-Z][a-z]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s}

    ]
  };
  DEF.venues.forEach(function(v){v.pa='';v.hi='';v.best='';v.price='';v.parking='';v.rooms='';v.ac='';v.landmark='';v.tour=''});
  function merge(a,b){
    if(Array.isArray(b))return clone(b);
    if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(a)){
      var o={}; Object.keys(a).forEach(function(k){o[k]=a[k]});

    }
    return b===undefined?a:b;
  }
  function build(j){
    j=(j&&typeof j==='object')?j:{};
    var c=merge(DEF,j);
    c.venues=DEF.venues.map(function(d,i){var v=merge(d,(j.venues&&j.venues[i])||{}); while(v.facts.length<4)v.facts.push({v:'',l:''}); v.facts=v.facts.slice(0,4); return v});

    return c;
  }


  var S={DEF:DEF,build:build,clone:clone,esc:esc,validId:validId,digits:digits,live:null,draft:null};
  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var esc=S.esc, validId=S.validId;
  var panel=$('#admin'), main=$('#aMain'), status=$('#aStatus'), fab=$('#aInboxFlag');
  var armed=false, W=null, tab='contact', vi=0, dirty=false, CB=[], unsub=null;
  var today=new Date(), avY=today.getFullYear(), avM=today.getMonth();
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var TABS=[['contact','Contact'],['venues','Venues'],['avail','Availability'],['pricing','Prices'],['sale','Sales'],['menu','Menu'],['photos','Photos'],['extras','Extras'],['reviews','Reviews'],['inbox','Callbacks']];

  function say(t,bad){status.textContent=t||'';status.style.color=bad?'#F2A3A3':''}
  function g(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},W)}
  function s(p,v){var ks=p.split('.'),o=W;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
  function mark(){dirty=true;say('Unsaved changes')}

  function fld(label,p,o){
    o=o||{}; var v=g(p); if(v==null)v=''; var h=o.hint?'<small>'+esc(o.hint)+'</small>':'', t=o.type||'text', ph=o.ph?' placeholder="'+esc(o.ph)+'"':'';
    if(t==='area')return '<label class="af">'+esc(label)+'<textarea data-p="'+p+'"'+ph+'>'+esc(v)+'</textarea>'+h+'</label>';
    if(t==='lines')return '<label class="af">'+esc(label)+'<textarea data-p="'+p+'" data-t="lines"'+ph+'>'+esc((v||[]).join('\n'))+'</textarea>'+h+'</label>';
    if(t==='check')return '<label class="af chk"><input type="checkbox" data-p="'+p+'"'+(v?' checked':'')+'><span>'+esc(label)+(o.hint?'<br><small style="color:var(--mute)">'+esc(o.hint)+'</small>':'')+'</span></label>';
    if(t==='sel')return '<label class="af">'+esc(label)+'<select data-p="'+p+'">'+o.opts.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'+h+'</label>';
    return '<label class="af">'+esc(label)+'<input type="'+(t==='num'?'number':t)+'" data-p="'+p+'"'+(t==='num'?' data-t="n" inputmode="decimal"':'')+' value="'+esc(v)+'"'+ph+'>'+h+'</label>';
  }
  var VPAGE=['sartaj-haveli.html','kings-villa-palace.html','grand-marrie-villa-palace.html','victoria-palace.html'];
  var SL={
    'media.hero':{t:'Home page big photo',where:'The big picture at the very top of the home page.',locs:[{l:'Home page, top',page:'index.html',sel:'#heroArt'}]},
    'media.dish':{t:'Restaurant photo',where:'Next to the menu on the Sartaj Haveli page.',locs:[{l:'Sartaj Haveli, menu',page:'sartaj-haveli.html',sel:'#dishArt'}]},
    'media.baBefore':{t:'Before photo',where:'The left side of the before and after slider on the Gallery page.',locs:[{l:'Gallery, slider',page:'gallery.html',sel:'#ba',force:'This slider appears once you add both before and after photos'}]},
    'media.baAfter':{t:'After photo',where:'The right side of the before and after slider on the Gallery page.',locs:[{l:'Gallery, slider',page:'gallery.html',sel:'#ba',force:'This slider appears once you add both before and after photos'}]},
    'story.photo':{t:'Our story photo',where:'Beside your story on the Our story page.',locs:[{l:'Our story page',page:'story.html',sel:'#stPhoto',force:'This page shows once you write your story'}]},
    'gallery':{t:'Home page gallery',where:'The "A look inside" strip on the home page, and the Gallery page.',locs:[{l:'Home page, gallery',page:'index.html',sel:'#galTease',force:'This gallery appears once you add a photo'},{l:'Gallery page',page:'gallery.html',sel:'#galGrid'}]}

  function slotMeta(p){
    var m=/^venues\.(\d+)\.(photo|gallery)$/.exec(p);

  }
  function photo(label,p,hint){
    var id=g(p), has=validId(id), m=slotMeta(p);
    return '<div class="a-card slot"><b>'+esc(label)+'</b><p class="slot-w"><span>Shows on:</span> '+esc(m.where)+'</p><div class="pf"><div class="pv"'+(has?' style="background-image:url('+id+')"':'')+'></div>'

  /* ---------- tabs ---------- */
  var V={
    contact:function(){return '<h3>Contact and brand</h3><p class="a-note">These show in the footer, the WhatsApp button and the callback form.</p>'

  }
  $('#loginForm').addEventListener('submit',async function(e){
    e.preventDefault(); var go=$('#lgGo'); go.disabled=true; $('#gateMsg').style.color=''; $('#gateMsg').textContent='Signing in…';
    try{
      var r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.anonKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('#lgEmail').value.trim(),password:$('#lgPass').value})});
      var j=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error(r.status===400||r.status===401?'Wrong email or password.':'Could not sign in. Try again.');
      keep(j); $('#lgPass').value=''; await loadAll();
    }catch(err){ showGate((err&&err.message)||'Could not sign in.',true) }
    go.disabled=false;
  });
  $('#aOut').addEventListener('click',async function(){
    if(dirty&&!armed){armed=true;say('You have unsaved changes. Tap Sign out again to leave without saving.',true);return}
    try{await api('/auth/v1/logout',{method:'POST'})}catch(x){}
    putSess(null); armed=false; dirty=false; CB=[]; showGate('Signed out.');
  });
  setInterval(function(){ if(!panel.hidden&&getSess())loadCb() },60000);
  (async function boot(){
    if(!SBOK){ showGate('The database is not connected yet. Open supabase-config.js and paste your two Supabase values, then reload.',true); $('#loginForm').hidden=true; return }
    if(getSess()){ try{ if(await loadAll())return }catch(x){} }
    showGate('Sartaj Royal Group. Owner only.');
  })();
})();

</script>
</body></html>
